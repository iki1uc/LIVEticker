<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>LIVEticker – AUTO‑Bereitschaft</title>

<style>
  body { background:#000; color:#0f0; font-family:Consolas, monospace; padding:20px; }
  #AUTO { border:1px solid #0f0; padding:20px; margin-top:20px; white-space:pre; }
</style>
</head>

<body>

<h1>LIVEticker – AUTO‑Bereitschaft</h1>
<div id="AUTO"></div>

<script>

// ------------------------------------------------------
// AUTO‑Bereitschafts‑Kernel
// ------------------------------------------------------

const AUTO = {
  MODE: "AUTO-BEREIT",
  READY: true,
  ACTIVE: false,

  // Alle Stationen angebunden (aber NICHT aktiv)
  STATION: {
    ROOM: true,
    RUN: true,
    PIPE: true,
    LOAD: true,
    SAVE: true,
    POOL: true,
    NC_SYNC: true,
    NCOCTA: true,
    SIX_D: true,
    SIX_E: true,
    RAW: true,
    SLI: true,
    RESPO: true,
    CUBE_LIVE: true,
    SEE_U: true,
    TOOLATOR: true,
    AUTO_CORE: true,
    AUTO_LOAD: true,
    AUTO_PIPE: true,
    AUTO_POOL: true,
    AUTO_SAVE: true
  },

  // Krallen / Ports / Achsen bereit
  PORT: {
    X4: "READY",
    IX: "READY",
    XI: "READY",
    AIR: "READY",
    AIV: "READY"
  },

  // Keine Engine aktiv
  ENGINE: null,
  PIPELINE: null,
  VECTOR: null,
  SUPERLAGE: null,
  ORBIT: null,
  PULSE: null,

  // Board‑Status
  BOARD: "LIVEticker ist vollständig angebunden und bereit."
};

// Ausgabe
document.getElementById("AUTO").innerText =
  JSON.stringify(AUTO, null, 2);

</script>

</body>
</html>
